[project]
name = "squarecloud-api"
dynamic = ["version"]  # from __version__ in src/squarecloud/client.py
description = "The official Python SDK for the Square Cloud API"
authors = [{ name = "Square Cloud", email = "support@squarecloud.app" }]
maintainers = [{ name = "Robert Nogueira", email = "robertlucasnogueira@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
keywords = ["squarecloud", "api", "sdk", "hosting"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://squarecloud.app"
Documentation = "https://docs.squarecloud.app/en/sdks/py/client"
Repository = "https://github.com/squarecloudofc/sdk-api-py"
Changelog = "https://github.com/squarecloudofc/sdk-api-py/releases"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/squarecloud/client.py"

[tool.hatch.build.targets.wheel]
packages = ["src/squarecloud"]

[tool.hatch.build.targets.sdist]
include = ["src/squarecloud", "README.md", "LICENSE"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14", "mypy>=1.18"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
faulthandler_timeout = 60  # dumps the stacks of a hung test
markers = ["live: hits the real API (needs SQUARECLOUD_API_KEY)"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S311"]  # S311: jitter is not crypto

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = false
files = ["src", "tests", "examples"]
